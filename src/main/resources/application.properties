spring.application.name=food-ordering-system

# Database (Hỗ trợ cấu hình qua biến môi trường khi deploy live demo, có sẵn giá trị mặc định cho local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/food_ordering_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA-Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


file.upload-dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Security remember-me secret key
app.security.remember-me-key=${REMEMBER_ME_KEY:foodOrderingSystemSecretRememberMeKey}

spring.devtools.restart.enabled=true
spring.thymeleaf.cache=false

server.servlet.session.persistent=false
