<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: admin-head}"></head>
<body class="admin-body">

    <div th:replace="~{fragments/admin-layout :: layout (~{::main}, 'food', 'categories')}">
        <main>
            <div class="page-header">
                <h1 class="page-title-main">Category Management</h1>
            </div>

            <div class="dashboard-row" style="grid-template-columns: 1fr 2fr;">
                <!-- Thêm biểu mẫu danh mục -->
                <section class="content-card">
                    <h3 class="card-title">Add New Category</h3>
                    <form th:action="@{/admin/categories/add}" method="post" style="margin-top: 20px;">
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 8px;">Category Name</label>
                            <input type="text" name="categoryName" class="table-search-input" style="width: 100%; margin-left: 0; border-radius: 8px;" required>
                        </div>
                        <button type="submit" class="btn-add-new" style="width: 100%; justify-content: center;">Add Category</button>
                    </form>
                </section>

                <!-- Category List -->
                <section class="content-card">
                    <h3 class="card-title">Existing Categories</h3>
                    <table class="admin-table" style="margin-top: 20px;">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>TÊN</th>
                                <th>SỐ MÓN ĂN</th>
                                <th>HÀNH ĐỘNG</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cat : ${categories}">
                                <td th:text="'#' + ${cat.categoryId}">#1</td>
                                <td th:text="${cat.categoryName}" class="fw-bold">Category Name</td>
                                <td th:text="${cat.foods != null ? cat.foods.size() : 0} + ' items'">0 items</td>
                                <td>
                                    <div class="action-btns">
                                        <a th:href="@{/admin/categories/delete/{id}(id=${cat.categoryId})}" class="action-btn delete" onclick="return confirm('Delete this category?')"><i class="fa-solid fa-trash"></i></a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </section>
            </div>
        </main>
    </div>

</body>
</html>
