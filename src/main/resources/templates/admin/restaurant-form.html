<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/admin-layout :: admin-head}"></th:block>
</head>
<body class="admin-body">

    <div th:replace="~{fragments/admin-layout :: layout (~{::main}, 'restaurant', 'add')}">
        <main>
            <div class="page-header">
                <div>
                    <h1 class="page-title-main" th:text="${restaurant.restaurantId == null ? 'Add New Restaurant' : 'Edit Restaurant'}">Add Restaurant</h1>
                    <div class="breadcrumb">
                        <a href="/admin" style="color: var(--primary-red); text-decoration: none;"><i class="fa-solid fa-house"></i> Home</a> / 
                        <a href="/admin/restaurants" style="color: var(--primary-red); text-decoration: none;">Restaurants</a> / 
                        <span th:text="${restaurant.restaurantId == null ? 'Add New' : 'Edit'}">Add New</span>
                    </div>
                </div>
            </div>

            <div class="form-container-card">
                <div class="card-header-main" style="margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 15px;">
                    <h5 class="product-list-title" style="margin: 0; font-size: 18px;">Thông tin nhà hàng</h5>
                    <p style="color: var(--text-muted); font-size: 13px; margin-top: 5px;">Nhập các chi tiết cơ bản của nhà hàng</p>
                </div>

                <form th:action="@{/admin/restaurants/save}" th:object="${restaurant}" method="post">
                    <input type="hidden" th:field="*{restaurantId}">
                    
                    <div class="form-grid">
                        <div class="admin-form-group">
                            <label class="admin-form-label">Tên nhà hàng</label>
                            <div class="input-with-icon">
                                <i class="fa-solid fa-store"></i>
                                <input type="text" th:field="*{name}" class="admin-input" placeholder="Nhập tên nhà hàng" required>
                            </div>
                        </div>

                        <div class="admin-form-group">
                            <label class="admin-form-label">Số điện thoại</label>
                            <div class="input-with-icon">
                                <i class="fa-solid fa-phone"></i>
                                <input type="text" th:field="*{phone}" class="admin-input" placeholder="ví dụ. +84 123 456 789" required>
                            </div>
                        </div>

                        <div class="admin-form-group form-group-full">
                            <label class="admin-form-label">Address</label>
                            <div class="input-with-icon">
                                <i class="fa-solid fa-location-dot"></i>
                                <input type="text" th:field="*{address}" class="admin-input" placeholder="Nhập địa chỉ đầy đủ" required>
                            </div>
                        </div>

                        <div class="admin-form-group form-group-full">
                            <label class="admin-form-label">Giờ hoạt động</label>
                            <div class="input-with-icon">
                                <i class="fa-solid fa-clock"></i>
                                <input type="text" th:field="*{operatingHours}" class="admin-input" placeholder="ví dụ. 07:00 - 21:00">
                            </div>
                        </div>
                    </div>

                    <div class="form-actions-modern">
                        <button type="submit" class="btn-save-modern">
                            <i class="fa-solid fa-check"></i>
                            <span th:text="${restaurant.restaurantId == null ? 'Create Restaurant' : 'Update Restaurant'}">Save Restaurant</span>
                        </button>
                        <a href="/admin/restaurants" class="btn-cancel-modern">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

</body>
</html>
