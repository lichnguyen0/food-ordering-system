<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/admin-layout :: admin-head}"></th:block>
    <link rel="stylesheet" href="/css/restaurant-form.css">
</head>
<body class="admin-body">

    <div th:replace="~{fragments/admin-layout :: layout (~{::main}, 'restaurant', 'add')}">
        <main>
            <div class="page-header">
                <div>
                    <h1 class="page-title-main" th:text="${restaurant.restaurantId == null ? 'Add New Restaurant' : 'Edit Restaurant'}">Add Restaurant</h1>
                    <div class="breadcrumb">
                        <a href="/admin" style="color: var(--primary-red); text-decoration: none;"><i class="fa-solid fa-house"></i> Home</a> / 
                        <a href="/admin/restaurants" style="color: var(--primary-red); text-decoration: none;">Restaurants</a> / 
                        <span th:text="${restaurant.restaurantId == null ? 'Add New' : 'Edit'}">Add New</span>
                    </div>
                </div>
            </div>

            <div class="form-container-card">
                <div class="card-header-main" style="margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 15px;">
                    <h5 class="product-list-title" style="margin: 0; font-size: 18px;">Thông tin nhà hàng</h5>
                    <p style="color: var(--text-muted); font-size: 13px; margin-top: 5px;">Nhập các chi tiết cơ bản của nhà hàng</p>
                </div>

                <form th:action="@{/admin/restaurants/save}" th:object="${restaurant}" method="post" enctype="multipart/form-data">
                    <input type="hidden" th:field="*{restaurantId}">
                    
                    <div class="form-grid">
                        <div class="admin-form-group">
                            <label class="admin-form-label">Tên nhà hàng</label>
                            <div class="input-with-icon">
                                <i class="fa-solid fa-store"></i>
                                <input type="text" th:field="*{name}" class="admin-input" placeholder="Nhập tên nhà hàng" required>
                            </div>
                        </div>

                        <div class="admin-form-group">
                            <label class="admin-form-label">Số điện thoại</label>
                            <div class="input-with-icon">
                                <i class="fa-solid fa-phone"></i>
                                <input type="text" th:field="*{phone}" class="admin-input" placeholder="ví dụ. +84 123 456 789" required>
                            </div>
                        </div>

                        <!-- Structured Location (Vietnam Provinces) -->
                        <div class="admin-form-group form-group-full">
                            <label class="admin-form-label">Địa chỉ (có cấu trúc)</label>
                            
                            <div style="display: grid; grid-template-columns: 260px 1fr; gap: 12px; margin-bottom: 12px;">
                                <!-- Province / City -->
                                <div>
                                    <label style="font-size: 12px; color: #666; display: block; margin-bottom: 4px;">Tỉnh / Thành phố</label>
                                    <select id="provinceSelect" class="admin-input">
                                        <option value="">-- Chọn Tỉnh/TP --</option>
                                    </select>
                                </div>
                                
                                <!-- Ward / Commune (post-2026 structure) -->
                                <div style="max-width: 420px;">
                                    <label style="font-size: 12px; color: #666; display: block; margin-bottom: 4px;">Phường / Xã</label>
                                    <select id="wardSelect" class="admin-input" disabled>
                                        <option value="">-- Chọn Phường/Xã --</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Street detail -->
                            <div style="margin-bottom: 10px; max-width: 480px;">
                                <label style="font-size: 12px; color: #666; display: block; margin-bottom: 4px;">Địa chỉ chi tiết (số nhà, tên đường...)</label>
                                <input type="text" id="streetDetailInput" class="admin-input" placeholder="Ví dụ: 123 Đường ABC">
                            </div>

                            <!-- Full Address (auto-generated) -->
                            <div style="margin-bottom: 10px;">
                                <label class="admin-form-label">Địa chỉ đầy đủ (tự động ghép)</label>
                                <div class="input-with-icon">
                                    <i class="fa-solid fa-location-dot"></i>
                                    <input type="text" th:field="*{address}" id="fullAddressInput" class="admin-input" placeholder="Địa chỉ sẽ tự động ghép khi chọn xong" readonly>
                                </div>
                            </div>

                            <!-- Coordinates -->
                            <div style="display: grid; grid-template-columns: 160px 160px auto; gap: 18px; align-items: end;">
                                <div>
                                    <label style="font-size: 12px; color: #666; display: block; margin-bottom: 4px;">Vĩ độ (Latitude)</label>
                                    <input type="text" th:field="*{latitude}" id="latitudeInput" class="admin-input" placeholder="21.0285" readonly style="width: 100%; box-sizing: border-box;">
                                </div>
                                <div>
                                    <label style="font-size: 12px; color: #666; display: block; margin-bottom: 4px;">Kinh độ (Longitude)</label>
                                    <input type="text" th:field="*{longitude}" id="longitudeInput" class="admin-input" placeholder="105.8542" readonly style="width: 100%; box-sizing: border-box;">
                                </div>
                                <div style="padding-bottom: 1px;">
                                    <button type="button" id="manualGeocodeBtn" class="btn-save-modern" style="padding: 8px 14px; font-size: 13px; height: 38px; white-space: nowrap;">
                                        <i class="fa-solid fa-sync"></i> Lấy lại tọa độ
                                    </button>
                                </div>
                            </div>

                            <div style="margin-top: 8px; font-size: 12px; color: #22c55e; display: none;" id="geoStatus">
                                <i class="fa-solid fa-check-circle"></i> Đã lấy tọa độ tự động
                            </div>
                        </div>

                        <div class="admin-form-group form-group-full">
                            <label class="admin-form-label">Giờ hoạt động</label>
                            <div class="input-with-icon">
                                <i class="fa-solid fa-clock"></i>
                                <input type="text" th:field="*{operatingHours}" class="admin-input" placeholder="ví dụ. 07:00 - 21:00">
                            </div>
                        </div>

                        <div class="admin-form-group form-group-full">
                            <label class="admin-form-label">Ảnh nhà hàng</label>
                            <div class="input-with-icon">
                                <i class="fa-solid fa-image"></i>
                                <input type="file" name="imageFile" class="admin-input" accept="image/*" id="imageFileInput">
                            </div>
                            <div class="image-preview-container">
                                <img id="imagePreview" th:src="${restaurant.image != null ? restaurant.image : '#'}" th:classappend="${restaurant.image != null ? 'has-image' : ''}" alt="Preview">
                            </div>
                        </div>

                        <div class="admin-form-group form-group-full">
                            <label class="admin-form-label">Kích hoạt ưu đãi</label>
                            <div class="promo-toggle-wrapper">
                                <label class="promo-toggle-label">
                                    <input type="checkbox" th:field="*{hasPromo}" id="hasPromoToggle" class="promo-toggle-input">
                                    <span class="promo-toggle-slider"></span>
                                    <span class="promo-toggle-text">Nhà hàng này đang có chương trình ưu đãi</span>
                                </label>
                                <p class="promo-toggle-hint">Bật để hiển thị nhà hàng này trên trang "Ưu đãi LunoFood"</p>
                            </div>
                        </div>

                        <!-- Chi tiết ưu đãi (hiện khi bật toggle) -->
                        <div class="promo-detail-section" id="promoDetailSection">
                            <div class="admin-form-group">
                                 <label class="admin-form-label" style="white-space: nowrap;"><i class="fa-solid fa-percent"></i> Mức giảm giá (%)</label>
                                <div class="input-with-icon">
                                    <i class="fa-solid fa-percent"></i>
                                    <input type="number" th:field="*{promoDiscount}" class="admin-input"
                                           placeholder="ví dụ: 20 (tức giảm 20%)" min="1" max="100" step="1">
                                </div>
                            </div>

                            <div class="admin-form-group">
                                <label class="admin-form-label"><i class="fa-solid fa-calendar-days"></i> Ngày bắt đầu</label>
                                <div class="input-with-icon">
                                    <i class="fa-solid fa-calendar-check"></i>
                                    <input type="date" th:field="*{promoStartDate}" class="admin-input">
                                </div>
                            </div>

                            <div class="admin-form-group">
                                <label class="admin-form-label"><i class="fa-solid fa-calendar-xmark"></i> Ngày kết thúc</label>
                                <div class="input-with-icon">
                                    <i class="fa-solid fa-calendar-xmark"></i>
                                    <input type="date" th:field="*{promoEndDate}" class="admin-input">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions-modern">
                        <button type="submit" class="btn-save-modern">
                            <i class="fa-solid fa-check"></i>
                            <span th:text="${restaurant.restaurantId == null ? 'Create Restaurant' : 'Update Restaurant'}">Save Restaurant</span>
                        </button>
                        <a href="/admin/restaurants" class="btn-cancel-modern">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="/js/restaurant-form.js"></script>
</body>
</html>
