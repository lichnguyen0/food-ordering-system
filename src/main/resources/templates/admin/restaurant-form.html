<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/admin-layout :: admin-head}"></th:block>
</head>
<body class="admin-body">

    <div th:replace="~{fragments/admin-layout :: layout (~{::main}, 'restaurant', 'add')}">
        <main>
            <div class="page-header">
                <h1 class="page-title-main" th:text="${restaurant.restaurantId == null ? 'Add New Restaurant' : 'Edit Restaurant'}">Add Restaurant</h1>
            </div>

            <div class="admin-card" style="padding: 30px;">
                <form th:action="@{/admin/restaurants/save}" th:object="${restaurant}" method="post">
                    <input type="hidden" th:field="*{restaurantId}">
                    
                    <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div class="form-group">
                            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Restaurant Name</label>
                            <input type="text" th:field="*{name}" class="table-search-input" style="width: 100%; margin-left: 0; border-radius: 8px;" required>
                        </div>
                        <div class="form-group">
                            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Phone Number</label>
                            <input type="text" th:field="*{phone}" class="table-search-input" style="width: 100%; margin-left: 0; border-radius: 8px;" required>
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Address</label>
                        <input type="text" th:field="*{address}" class="table-search-input" style="width: 100%; margin-left: 0; border-radius: 8px;" required>
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Operating Hours (e.g., 07:00-21:00)</label>
                        <input type="text" th:field="*{operatingHours}" class="table-search-input" style="width: 100%; margin-left: 0; border-radius: 8px;" placeholder="07:00-21:00">
                    </div>

                    <div class="form-actions" style="margin-top: 30px; display: flex; gap: 15px;">
                        <button type="submit" class="btn-add-new">Save Restaurant</button>
                        <a href="/admin/restaurants" class="btn-view-all" style="text-decoration: none; display: flex; align-items: center;">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

</body>
</html>
