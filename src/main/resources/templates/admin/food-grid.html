<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/admin-layout :: admin-head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin-food-grid.css}">
</head>
<body class="admin-body">

    <div th:replace="~{fragments/admin-layout :: layout (~{::main}, 'food', 'grid')}">
        <main>
            <div class="page-header">
                <div>
                    <h1 class="page-title-main">Menu Grid</h1>
                    <div class="breadcrumb">
                        <a href="/admin" style="color: #EE5D50; text-decoration: none;"><i class="fa-solid fa-house"></i> Home</a> / 
                        <a href="/admin/foods" style="color: #EE5D50; text-decoration: none;">Menu</a> / Grid
                    </div>
                </div>
                <a href="/admin/foods/add" class="btn-add-new">
                    <i class="fa-solid fa-plus"></i> Add New Food
                </a>
            </div>

            <!-- Category Filter -->
            <div class="food-grid-filter">
                <label for="categoryFilter">Lọc theo danh mục:</label>
                <select id="categoryFilter" class="table-search-input">
                    <option value="">Tất cả món ăn</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.categoryId}"
                            th:text="${cat.categoryName}"
                            th:selected="${selectedCategoryId != null && selectedCategoryId == cat.categoryId}">
                    </option>
                </select>
            </div>

            <!-- Food Grid -->
            <div class="catalogue-grid">
                <!-- Empty State -->
                <div th:if="${foods.empty}" class="food-grid-empty">
                    <i class="fa-solid fa-utensils"></i>
                    <p>Không có món ăn nào trong danh mục này.</p>
                </div>

                <!-- Food Cards -->
                <div th:each="food : ${foods}" th:unless="${foods.empty}" class="food-card">
                    <div class="food-img-wrapper">
                        <img th:src="${food.image != null ? food.image : 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c'}" alt="Food">
                    </div>
                    <div class="food-info">
                        <div class="food-title-row">
                            <h3 class="food-title" th:text="${food.foodName}">Food Name</h3>
                            <div class="food-price" th:text="${#numbers.formatDecimal(food.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">50,000 ₫</div>
                        </div>
                        
                        <div class="food-status-row">
                            <div class="food-qty" th:text="'ID: ' + ${#numbers.formatInteger(food.foodId, 5)}">ID: 00001</div>
                            <div class="stock-badge" 
                                 th:classappend="${food.status.name() == 'AVAILABLE' ? 'stock-in' : 'stock-out'}"
                                 th:text="${food.status.name() == 'AVAILABLE' ? 'In Stock' : 'Out of Stock'}">
                                In Stock
                            </div>
                        </div>

                        <div class="food-desc" th:text="${food.description != null && !food.description.isEmpty() ? food.description : 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore.'}">
                            Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore.
                        </div>

                        <div class="card-actions">
                            <a th:href="@{/admin/foods/delete/{id}(id=${food.foodId})}" 
                               class="btn-remove" 
                               onclick="return confirm('Are you sure you want to remove this item?')">Remove</a>
                            <a th:href="@{/admin/foods/edit/{id}(id=${food.foodId})}" class="btn-edit-dark">Edit</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pagination -->
            <div class="grid-pagination-footer" th:if="${foodPage != null && foodPage.totalElements > 0}">
                <div class="pagination-info">
                    Hiển thị
                    <span th:text="${foodPage.number * foodPage.size + 1}">1</span>
                    -
                    <span th:text="${foodPage.number * foodPage.size + foodPage.numberOfElements}">12</span>
                    /
                    <span th:text="${foodPage.totalElements}">0</span> món ăn
                </div>

                <div class="pagination-btns" th:if="${foodPage.totalPages > 1}">
                    <!-- Previous -->
                    <a th:if="${foodPage.hasPrevious()}"
                       th:href="@{/admin/foods/grid(page=${foodPage.number - 1}, size=${foodPage.size}, categoryId=${selectedCategoryId})}"
                       class="page-btn">Trước</a>

                    <!-- Page numbers -->
                    <a th:each="i : ${#numbers.sequence(0, foodPage.totalPages - 1)}"
                       th:href="@{/admin/foods/grid(page=${i}, size=${foodPage.size}, categoryId=${selectedCategoryId})}"
                       th:text="${i + 1}"
                       th:classappend="${i == foodPage.number} ? 'active' : ''"
                       class="page-btn"></a>

                    <!-- Next -->
                    <a th:if="${foodPage.hasNext()}"
                       th:href="@{/admin/foods/grid(page=${foodPage.number + 1}, size=${foodPage.size}, categoryId=${selectedCategoryId})}"
                       class="page-btn">Tiếp</a>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/admin-food-grid.js}"></script>
</body>
</html>
