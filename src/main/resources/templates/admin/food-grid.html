<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Grid | LunoFood Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">
    <link rel="stylesheet" th:href="@{/css/food-grid.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Roboto:wght@500&display=swap" rel="stylesheet">
    <script th:src="@{/js/admin.js}" defer></script>
    <script th:src="@{/js/food-grid.js}" defer></script>
</head>

<body>

    <aside th:replace="~{fragments/admin-layout :: sidebar('food', 'grid')}"></aside>

    <main class="main-dashboard">
        <header th:replace="~{fragments/admin-layout :: topbar}"></header>

        <div class="breadcrumb">
            <i class="fa-solid fa-house"></i>
            <a href="/admin">Home</a> / 
            <a href="/admin/foods">Menu</a> / 
            <span class="active-crumb">Menu Grid</span>
        </div>

        <div class="grid-card">
            <div class="grid-controls">
                <div class="entries-wrapper">
                    Show
                    <select class="entries-select">
                        <option value="12">12</option>
                        <option value="24">24</option>
                        <option value="48">48</option>
                    </select>
                    entries
                </div>
                <div class="grid-search-wrapper">
                    <input type="text" class="grid-search-input" placeholder="Search here...">
                </div>
            </div>

            <div class="food-grid-container">
                <!-- Initially rendered by Thymeleaf for SEO/No-JS, but will be handled by JS for pagination/search -->
                <div class="food-card" th:each="f : ${foods}">
                    <div class="food-image-wrapper">
                        <img th:src="${f.image != null ? f.image : '/images/placeholder.png'}" alt="Food Image">
                    </div>
                    <div class="food-content">
                        <div class="food-info-top">
                            <h3 class="food-name" th:text="${f.foodName}">Delicious Food</h3>
                            <span class="price-tag" th:text="${#numbers.formatCurrency(f.price)}">$45.50</span>
                        </div>
                        <div class="food-info-mid">
                            <span class="food-qty" th:text="'Qty' + ${f.foodId}">Qty1467</span>
                            <span th:class="${f.status.name() == 'AVAILABLE' ? 'food-badge instock' : 'food-badge outstock'}"
                                th:text="${f.status.name() == 'AVAILABLE' ? 'In Stock' : 'Out of Stock'}">In Stock</span>
                        </div>
                        <p class="food-desc">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
                        <div class="action-buttons">
                            <a th:href="@{/admin/foods/delete/{id}(id=${f.foodId})}" class="action-btn-grid delete"
                                onclick="return confirm('Are you sure you want to delete this item?');">Remove</a>
                            <a th:href="@{/admin/foods/edit/{id}(id=${f.foodId})}" class="action-btn-grid edit">Edit</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid-footer-pagination">
                <div class="pagination-info">
                    Showing <span id="page-info-start">1</span> to <span id="page-info-end"
                        th:text="${#lists.size(foods) > 12 ? 12 : #lists.size(foods)}">12</span> of <span
                        id="page-info-total" th:text="${#lists.size(foods)}">36</span> entries
                </div>
                <div class="pagination-btns" id="pagination-controls">
                    <!-- Pagination buttons will be generated by JS -->
                </div>
            </div>
        </div>
    </main>

    <script th:inline="javascript">
        /*<![CDATA[*/
        var foods = /*[[${foods}]]*/ [];
        /*]]>*/
    </script>

</body>

</html>
