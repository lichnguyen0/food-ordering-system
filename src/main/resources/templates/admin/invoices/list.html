<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/admin-layout :: admin-head}"></th:block>
    <!-- CSS riêng cho trang hóa đơn -->
    <link rel="stylesheet" href="/css/admin-invoices.css">
</head>
<body>
    <div th:replace="~{fragments/admin-layout :: layout (~{::main}, 'invoice', 'list')}">
        <main class="admin-invoices-page">
            <div class="page-header">
                <h1 class="page-title-main">Danh sách Hóa đơn</h1>
                <div class="header-actions">
                    <button class="btn btn-outline"><i class="fa-solid fa-download"></i> Xuất Excel</button>
                </div>
            </div>

            <!-- Khu vực lọc và tìm kiếm -->
            <div class="filter-section">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="invoiceSearch" placeholder="Tìm kiếm mã HĐ, tên KH, số điện thoại...">
                </div>
                <div class="filter-group">
                    <select class="filter-select" id="statusFilter">
                        <option value="">Tất cả trạng thái</option>
                        <option value="pending">Chờ xác nhận</option>
                        <option value="confirmed">Đã xác nhận</option>
                        <option value="shipping">Đang giao</option>
                        <option value="completed">Đã hoàn thành</option>
                        <option value="cancelled">Đã hủy</option>
                    </select>
                    <input type="date" class="filter-date" id="dateFilter">
                </div>
            </div>

            <!-- Bảng dữ liệu -->
            <div class="table-container">
                <table class="invoices-table" id="invoicesTable">
                    <thead>
                        <tr>
                            <th>Mã HĐ</th>
                            <th>Khách hàng</th>
                            <th>Ngày đặt</th>
                            <th>Tổng tiền</th>
                            <th>Thanh toán</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Hiển thị dữ liệu thật nếu có, ngược lại có thể báo trống -->
                        <tr th:if="${invoices == null or invoices.empty}">
                            <td colspan="7" style="text-align: center;">Chưa có hóa đơn nào</td>
                        </tr>
                        <tr th:each="invoice : ${invoices}">
                            <td><span class="invoice-id" th:text="${invoice.invoiceCode}">#INV</span></td>
                            <td>
                                <div class="customer-info">
                                    <div class="customer-name" th:text="${invoice.customerName}">Tên Khách</div>
                                    <div class="customer-phone" th:text="${invoice.customerPhone}">SĐT</div>
                                </div>
                            </td>
                            <td th:text="${#temporals.format(invoice.createdAt, 'dd/MM/yyyy HH:mm')}">Ngày đặt</td>
                            <td><span class="invoice-total" th:text="${#numbers.formatDecimal(invoice.totalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'">Tổng tiền</span></td>
                            <td>
                                <span th:class="'payment-method ' + ${#strings.toLowerCase(invoice.paymentMethod)}" 
                                      th:text="${invoice.paymentMethod == 'CASH' ? 'Tiền mặt' : (invoice.paymentMethod == 'MOMO' ? 'MoMo' : (invoice.paymentMethod == 'VNPAY' ? 'VNPay' : invoice.paymentMethod))}">Tiền mặt</span>
                            </td>
                            <td>
                                <span th:if="${invoice.paymentStatus.name() == 'UNPAID'}" class="status-badge status-pending">Chưa thanh toán</span>
                                <span th:if="${invoice.paymentStatus.name() == 'PAID'}" class="status-badge status-completed">Đã thanh toán</span>
                                <span th:if="${invoice.paymentStatus.name() == 'REFUNDED'}" class="status-badge status-cancelled">Đã hoàn tiền</span>
                                <span th:if="${invoice.paymentStatus.name() == 'CANCELLED'}" class="status-badge status-cancelled">Đã hủy</span>
                            </td>
                            <td>
                                <div class="action-buttons">
                                    <a th:href="@{/admin/invoices/{id}(id=${invoice.invoiceId})}" class="btn-action view" title="Xem chi tiết"><i class="fa-regular fa-eye"></i></a>
                                    <button class="btn-action print" title="In hóa đơn"><i class="fa-solid fa-print"></i></button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Phân trang -->
            <div class="pagination-container">
                <div class="pagination-info">Hiển thị 1 - 4 trong tổng số 24 hóa đơn</div>
                <ul class="pagination">
                    <li class="page-item disabled"><a class="page-link" href="#"><i class="fa-solid fa-chevron-left"></i></a></li>
                    <li class="page-item active"><a class="page-link" href="#">1</a></li>
                    <li class="page-item"><a class="page-link" href="#">2</a></li>
                    <li class="page-item"><a class="page-link" href="#">3</a></li>
                    <li class="page-item"><a class="page-link" href="#"><i class="fa-solid fa-chevron-right"></i></a></li>
                </ul>
            </div>
            
            <!-- JS riêng cho trang hóa đơn -->
            <script src="/js/admin-invoices.js"></script>
        </main>
    </div>
</body>
</html>
