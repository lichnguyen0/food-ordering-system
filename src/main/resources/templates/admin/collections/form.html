<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: admin-head}"></head>
<body class="admin-body">
    <div th:replace="~{fragments/admin-layout :: layout (~{::main}, 'marketing', 'list')}">
        <main>
            <div class="page-header">
                <h2 class="page-title" th:text="${collection.collectionId == null ? 'Thêm Bộ sưu tập' : 'Sửa Bộ sưu tập'}">Thêm Bộ sưu tập</h2>
            </div>

            <div class="admin-card">
                <form th:action="@{/admin/collections/save}" th:object="${collection}" method="post" class="admin-form">
                    <input type="hidden" th:field="*{collectionId}" />
                    
                    <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div class="form-group">
                            <label>Tên hiển thị <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Ví dụ: Ưu đãi mùa hè" required>
                        </div>
                        <div class="form-group">
                            <label>Loại nội dung <span class="text-danger">*</span></label>
                            <select th:field="*{type}" class="form-control" required>
                                <option value="">-- Chọn loại --</option>
                                <option value="OFFER">Ưu đãi hôm nay (Offers)</option>
                                <option value="RECOMMENDATION">Dành cho bạn (Recommendations)</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Thuộc Nhà hàng <span class="text-danger">*</span></label>
                        <select th:field="*{restaurant}" class="form-control" id="restaurantSelect" required>
                            <option value="">-- Chọn nhà hàng --</option>
                            <option th:each="r : ${restaurants}" th:value="${r.restaurantId}" th:text="${r.name}"></option>
                        </select>
                        <small class="text-muted">Chọn nhà hàng để lọc danh sách món ăn bên dưới.</small>
                    </div>

                    <div class="form-group">
                        <label>Mô tả ngắn</label>
                        <textarea th:field="*{description}" class="form-control" rows="2"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Chọn món ăn của nhà hàng này</label>
                        <div class="food-selection-grid" id="foodGrid">
                            <div th:each="food : ${allFoods}" class="food-checkbox-item" 
                                 th:attr="data-restaurant-id=${food.restaurant != null ? food.restaurant.restaurantId : 0}"
                                 th:style="${collection.restaurant != null && food.restaurant != null && food.restaurant.restaurantId != collection.restaurant.restaurantId ? 'display:none' : ''}">
                                <input type="checkbox" name="foodIds" th:value="${food.foodId}" 
                                       th:id="'food-' + ${food.foodId}"
                                       th:checked="${collection.foods.contains(food)}">
                                <label th:for="'food-' + ${food.foodId}">
                                    <img th:src="${food.image != null ? food.image : 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c'}" class="mini-food-img">
                                    <div class="mini-food-info">
                                        <span class="mini-food-name" th:text="${food.foodName}">Tên món</span>
                                        <span class="mini-food-price" th:text="${#numbers.formatDecimal(food.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</span>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions" style="margin-top: 30px;">
                        <button type="submit" class="btn-primary">Lưu bộ sưu tập</button>
                        <a href="/admin/collections" class="btn-secondary">Hủy bỏ</a>
                    </div>
                </form>
            </div>

            <style>
                .food-selection-grid {
                    display: grid;
                    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                    gap: 15px;
                    max-height: 400px;
                    overflow-y: auto;
                    padding: 15px;
                    border: 1px solid #eee;
                    border-radius: 8px;
                    background: #fbfbfb;
                }
                .food-checkbox-item {
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    padding: 10px;
                    border: 1px solid #fff;
                    background: #fff;
                    border-radius: 8px;
                    cursor: pointer;
                    box-shadow: 0 2px 5px rgba(0,0,0,0.02);
                    transition: all 0.2s;
                }
                .food-checkbox-item:hover {
                    border-color: var(--primary-red);
                    transform: translateY(-2px);
                }
                .food-checkbox-item input:checked + label {
                    font-weight: 700;
                }
                .mini-food-img { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; }
                .mini-food-name { font-size: 13px; color: #333; display: block; }
                .mini-food-price { font-size: 11px; color: var(--primary-red); }
            </style>

            <script>
                document.getElementById('restaurantSelect').addEventListener('change', function() {
                    const restaurantId = this.value;
                    const foodItems = document.querySelectorAll('.food-checkbox-item');
                    
                    foodItems.forEach(item => {
                        const itemResId = item.getAttribute('data-restaurant-id');
                        if (!restaurantId || itemResId === restaurantId) {
                            item.style.display = 'flex';
                        } else {
                            item.style.display = 'none';
                            // Bỏ chọn nếu món đó không thuộc nhà hàng mới
                            item.querySelector('input').checked = false;
                        }
                    });
                });
            </script>
        </main>
    </div>
</body>
</html>
