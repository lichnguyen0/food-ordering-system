<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: admin-head}"></head>
<body class="admin-body">
    <div th:replace="~{fragments/admin-layout :: layout (~{::main}, 'marketing', 'list')}">
        <main>
            <div class="page-header">
                <div>
                    <h1 class="page-title-main">Quản lý Bộ sưu tập</h1>
                    <div class="breadcrumb">
                        <a href="/admin" style="color: var(--primary-red); text-decoration: none;"><i class="fa-solid fa-house"></i> Home</a> / 
                        <span>Marketing</span> / 
                        <span>Bộ sưu tập</span>
                    </div>
                </div>
                <a href="/admin/collections/add" class="btn-add-new">
                    <i class="fa-solid fa-plus"></i> Thêm Bộ sưu tập mới
                </a>
            </div>

            <div class="admin-card">
                <div class="card-header-main">
                    <h5 class="product-list-title">Danh sách Bộ sưu tập</h5>
                    <div class="header-actions">
                        <div class="search-bar" style="width: 250px; background: #f4f7fe; border: none;">
                            <input type="text" placeholder="Tìm kiếm bộ sưu tập..." style="background: transparent;">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </div>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>MSP</th>
                                <th>Tên hiển thị</th>
                                <th>Loại nội dung</th>
                                <th>Nhà hàng áp dụng</th>
                                <th>Quy mô</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${collections}">
                                <td class="id-column" th:text="${#strings.substring('00000', 0, 5 - #strings.length(c.collectionId)) + c.collectionId}">00001</td>
                                <td>
                                    <div class="product-info">
                                        <div class="product-details">
                                            <div class="product-name" th:text="${c.name}">Tên bộ sưu tập</div>
                                            <div class="product-category" th:text="${c.description != null ? c.description : 'Không có mô tả'}">Mô tả...</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <span class="status-badge" 
                                          th:classappend="${c.type == 'OFFER' ? 'status-delivered' : 'status-shipped'}"
                                          th:text="${c.type == 'OFFER' ? 'Ưu đãi' : 'Gợi ý'}">Loại</span>
                                </td>
                                <td>
                                    <div class="restaurant-tag">
                                        <i class="fa-solid fa-store" style="font-size: 12px; margin-right: 5px; color: #718096;"></i>
                                        <span th:text="${c.restaurant != null ? c.restaurant.name : 'Toàn cầu (Global)'}">Nhà hàng</span>
                                    </div>
                                </td>
                                <td>
                                    <span class="badge-count" th:text="${c.foods.size()} + ' món ăn'">0 món</span>
                                </td>
                                <td>
                                    <div class="action-btns">
                                        <a th:href="@{/admin/collections/edit/{id}(id=${c.collectionId})}" class="action-btn edit" title="Chỉnh sửa">
                                            <i class="fa-solid fa-pen-to-square"></i>
                                        </a>
                                        <a th:href="@{/admin/collections/delete/{id}(id=${c.collectionId})}" 
                                           class="action-btn delete" 
                                           onclick="return confirm('Bạn có chắc chắn muốn xóa bộ sưu tập này?')" title="Xóa bỏ">
                                            <i class="fa-solid fa-trash-can"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(collections)}">
                                <td colspan="6" class="text-center py-5">
                                    <img src="https://cdn-icons-png.flaticon.com/512/7486/7486744.png" style="width: 80px; opacity: 0.2; margin-bottom: 15px;">
                                    <p class="text-muted">Chưa có bộ sưu tập nào được tạo.</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <style>
                .badge-count { 
                    background: #EBF4FF; 
                    color: #3182CE; 
                    padding: 4px 12px; 
                    border-radius: 20px; 
                    font-size: 12px; 
                    font-weight: 600; 
                }
                .restaurant-tag {
                    color: #4A5568;
                    font-size: 13px;
                    font-weight: 500;
                }
                .status-badge.status-shipped {
                    background: #EBF8FF;
                    color: #2B6CB0;
                }
            </style>
        </main>
    </div>
</body>
</html>
