<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Food</title>
</head>
<body>
    <h1>Food Management</h1>
    <nav>
        <a href="/admin">Home</a> |
        <a href="/admin/orders">Orders</a> |
        <a href="/admin/foods">Food Management</a>
    </nav>
    <hr>
    <a href="/admin/foods/add">Add New Food</a>
    <br><br>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Category</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        <tr th:each="f : ${foods}">
            <td th:text="${f.foodId}"></td>
            <td th:text="${f.foodName}"></td>
            <td th:text="${f.price}"></td>
            <td th:text="${f.category != null ? f.category.categoryName : 'N/A'}"></td>
            <td th:text="${f.status}"></td>
            <td>
                <a th:href="@{/admin/foods/edit/{id}(id=${f.foodId})}">Edit</a> |
                <a th:href="@{/admin/foods/delete/{id}(id=${f.foodId})}" 
                   onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
    </table>
</body>
</html>
