<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: admin-head}"></head>
<body class="admin-body">

    <div th:replace="~{fragments/admin-layout :: layout (~{::main}, 'orders', '')}">
        <main>
            <div class="page-header">
                <h1 class="page-title-main">Order Management</h1>
            </div>

            <div th:if="${success}" class="alert-success">
                <i class="fa-solid fa-circle-check" style="margin-right: 10px;"></i>
                <strong th:text="${success}">Success!</strong>
            </div>

            <div class="product-list-card">
                <table class="food-management-table">
                    <thead>
                        <tr>
                            <th>ORDER ID</th>
                            <th>USER</th>
                            <th>RESTAURANT</th>
                            <th>ITEMS</th>
                            <th>TOTAL</th>
                            <th>STATUS</th>
                            <th>DATE</th>
                            <th>ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}">
                            <td th:text="'#' + ${order.orderId}">#1001</td>
                            <td th:text="${order.user != null ? order.user.username : 'Guest'}">User</td>
                            <td th:text="${order.restaurant != null ? order.restaurant.name : 'N/A'}">Restaurant</td>
                            <td th:text="${order.items.size()} + ' items'">3 items</td>
                            <td th:text="'$' + ${order.totalAmount}" class="fw-bold">$45.00</td>
                            <td>
                                <span class="status-badge" 
                                      th:classappend="${order.status.name() == 'DELIVERED' ? 'status-delivered' : (order.status.name() == 'CANCELLED' ? 'status-cancelled' : 'status-pending')}"
                                      th:text="${order.status}">PENDING</span>
                            </td>
                            <td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">15/05/2026</td>
                            <td>
                                <div class="action-btns">
                                    <form th:if="${order.status.name() == 'PENDING'}" th:action="@{/admin/orders/update-status}" method="post">
                                        <input type="hidden" name="orderId" th:value="${order.orderId}">
                                        <input type="hidden" name="status" value="DELIVERED">
                                        <button type="submit" class="action-btn edit" title="Mark Delivered"><i class="fa-solid fa-check"></i></button>
                                    </form>
                                    <a th:href="@{/admin/orders/detail/{id}(id=${order.orderId})}" class="action-btn edit" title="View Detail"><i class="fa-solid fa-eye"></i></a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

</body>
</html>
