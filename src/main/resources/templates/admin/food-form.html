<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/admin-layout :: admin-head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/food-form.css}">
    <script th:src="@{/js/food-form.js}" defer></script>
</head>
<body class="admin-body">

    <div th:replace="~{fragments/admin-layout :: layout (~{::main}, 'food', ${foodDTO.foodId == null ? 'add' : 'list'})}">
        <main>
            <div class="breadcrumb">
                <a href="/admin"><i class="fa-solid fa-house"></i> Home</a> 
                <i class="fa-solid fa-chevron-right"></i> 
                <a href="/admin/foods">Menu</a> 
                <i class="fa-solid fa-chevron-right"></i> 
                <span th:text="${foodDTO.foodId == null ? 'Add New' : 'Edit Item'}">Add Product</span>
            </div>

            <!-- Alert Message (Conditional) -->
            <div class="alert-success" th:if="${success}">
                <i class="fa-solid fa-circle-check" style="margin-right: 10px;"></i>
                <strong th:text="${success}">Well done!</strong>
            </div>

            <form th:action="@{/admin/foods/save}" th:object="${foodDTO}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{foodId}">
                <input type="hidden" th:field="*{image}">

                <div class="add-product-container">
                    <!-- Left Side: Form Details -->
                    <div class="form-card">
                        <div class="form-card-title">Add Product Form</div>

                        <div class="form-group">
                            <label>Product Name</label>
                            <input type="text" th:field="*{foodName}" class="form-control" placeholder="Pizza">
                            <span th:if="${#fields.hasErrors('foodName')}" th:errors="*{foodName}" style="color:var(--primary-red); font-size: 12px;"></span>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Select Category</label>
                                <select th:field="*{categoryId}" class="form-control">
                                    <option value="">-- Select Category --</option>
                                    <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}"></option>
                                </select>
                                <span th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" style="color:var(--primary-red); font-size: 12px;"></span>
                            </div>
                            <div class="form-group">
                                <label>Select Restaurant</label>
                                <select th:field="*{restaurantId}" class="form-control">
                                    <option value="">-- Select Restaurant --</option>
                                    <option th:each="r : ${restaurants}" th:value="${r.restaurantId}" th:text="${r.name}"></option>
                                </select>
                                <span th:if="${#fields.hasErrors('restaurantId')}" th:errors="*{restaurantId}" style="color:var(--primary-red); font-size: 12px;"></span>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Số tiền giảm giá (để trống nếu không giảm)</label>
                                <div class="price-input-wrapper">
                                    <input type="number" step="1000" min="0" th:field="*{discountPrice}" class="form-control" placeholder="Ví dụ: 10000">
                                    <span class="price-suffix">₫</span>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Giá (₫ VND)</label>
                                <div class="price-input-wrapper">
                                    <input type="number" step="1000" min="0" th:field="*{price}" class="form-control" placeholder="Ví dụ: 50000">
                                    <span class="price-suffix">₫</span>
                                </div>
                                <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" style="color:var(--primary-red); font-size: 12px;"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Description</label>
                            <textarea th:field="*{description}" class="form-control" placeholder="Message"></textarea>
                            <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color:var(--primary-red); font-size: 12px;"></span>
                        </div>

                        <div class="form-group">
                            <label>Product Image</label>
                            <div class="image-upload-wrapper">
                                <span class="custom-file-btn">Chọn tệp</span>
                                <span class="file-name-display">Không có tệp nào được chọn</span>
                                <input type="file" name="imageFiles" accept="image/*" multiple>
                            </div>
                            <p style="font-size: 11px; color: var(--text-muted); margin-top: 8px;">Upload Images...</p>
                        </div>
                        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
                        
                        <div class="form-card-title" style="display: flex; justify-content: space-between; align-items: center;">
                            <span>Quản lý Tùy chọn (Size / Topping)</span>
                            <button type="button" class="btn-save" onclick="addOptionGroup()" style="padding: 6px 12px; font-size: 13px; background: #f0f0f0; color: #333; border: 1px solid #ddd;"><i class="fa-solid fa-plus"></i> Thêm Nhóm Tùy Chọn</button>
                        </div>
                        
                        <div id="optionGroupsContainer">
                            <!-- Thymeleaf loop for existing option groups when editing -->
                            <div th:each="group, gStat : *{optionGroups}" class="option-group-card" style="border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: #fafafa; position: relative;">
                                <button type="button" onclick="this.closest('.option-group-card').remove(); reindexOptions();" style="position: absolute; top: 15px; right: 15px; background: none; border: none; color: #dc3545; cursor: pointer;"><i class="fa-solid fa-trash"></i></button>
                                
                                <input type="hidden" th:name="|optionGroups[${gStat.index}].groupId|" th:value="${group.groupId}">
                                
                                <div class="form-row" style="margin-bottom: 10px;">
                                    <div class="form-group" style="flex: 2;">
                                        <label>Tên Nhóm (VD: Kích cỡ, Topping)</label>
                                        <input type="text" th:name="|optionGroups[${gStat.index}].groupName|" th:value="${group.groupName}" class="form-control group-name-input" required>
                                    </div>
                                    <div class="form-group" style="flex: 1; display: flex; align-items: center; gap: 10px; margin-top: 25px;">
                                        <label style="margin:0; display:flex; align-items:center; gap:5px; cursor:pointer;">
                                            <input type="checkbox" th:name="|optionGroups[${gStat.index}].required|" th:checked="${group.required}" value="true"> Bắt buộc
                                        </label>
                                        <label style="margin:0; display:flex; align-items:center; gap:5px; cursor:pointer;">
                                            <input type="checkbox" th:name="|optionGroups[${gStat.index}].multiple|" th:checked="${group.multiple}" value="true"> Chọn nhiều
                                        </label>
                                    </div>
                                </div>
                                
                                <div class="option-items-container">
                                    <label style="font-size: 13px; font-weight: 500; color: #555; display: block; margin-bottom: 8px;">Danh sách Tùy chọn con:</label>
                                    <div class="items-list">
                                        <div th:each="item, iStat : ${group.optionItems}" class="option-item-row" style="display: flex; gap: 10px; margin-bottom: 8px; align-items: center;">
                                            <input type="hidden" th:name="|optionGroups[${gStat.index}].optionItems[${iStat.index}].itemId|" th:value="${item.itemId}">
                                            <input type="text" th:name="|optionGroups[${gStat.index}].optionItems[${iStat.index}].itemName|" th:value="${item.itemName}" class="form-control item-name-input" placeholder="Tên (VD: Size L)" required style="flex: 2; padding: 6px 12px;">
                                            <div class="price-input-wrapper" style="flex: 1; margin: 0;">
                                                <input type="number" th:name="|optionGroups[${gStat.index}].optionItems[${iStat.index}].extraPrice|" th:value="${item.extraPrice}" class="form-control item-price-input" placeholder="Giá cộng thêm" style="padding: 6px 12px;" required>
                                                <span class="price-suffix" style="padding: 6px;">₫</span>
                                            </div>
                                            <button type="button" onclick="this.closest('.option-item-row').remove(); reindexOptions();" style="background: none; border: none; color: #dc3545; cursor: pointer; padding: 5px;"><i class="fa-solid fa-times"></i></button>
                                        </div>
                                    </div>
                                    <button type="button" onclick="addOptionItem(this)" style="background: none; border: 1px dashed #ccc; padding: 5px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; margin-top: 5px; color: #666; width: 100%;"><i class="fa-solid fa-plus"></i> Thêm tùy chọn con</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Right Side: Preview -->
                    <div class="form-card">
                        <div class="form-card-title">Product</div>
                        
                        <div class="preview-container">
                            <img th:src="*{image != null ? image : 'https://via.placeholder.com/800x450?text=Product+Preview'}" class="main-preview-img" alt="Preview">
                            
                            <div class="thumbnail-row">
                                <div class="thumb-wrapper" th:if="*{image != null}">
                                    <img th:src="*{image}" class="thumb-img active">
                                </div>
                                <th:block th:if="*{additionalImages != null}">
                                    <div class="thumb-wrapper" th:each="img : *{additionalImages}">
                                        <img th:src="${img}" class="thumb-img">
                                    </div>
                                </th:block>
                                <div class="thumb-wrapper" th:if="*{image == null}">
                                    <img src="https://via.placeholder.com/100x75?text=Img1" class="thumb-img active">
                                </div>
                            </div>
                        </div>

                        <div class="toggle-group">
                            <span class="toggle-label">Status Available</span>
                            <label class="switch">
                                <input type="checkbox" id="statusToggle" th:checked="${foodDTO.status?.name() == 'AVAILABLE' || foodDTO.status == null}">
                                <span class="slider"></span>
                            </label>
                            <input type="hidden" id="statusHidden" th:field="*{status}">
                        </div>

                        <div class="toggle-group">
                            <span class="toggle-label">Discount Active</span>
                            <label class="switch">
                                <input type="checkbox" id="discountToggle" th:checked="${foodDTO.discountPrice != null}" disabled>
                                <span class="slider"></span>
                            </label>
                        </div>

                        <div class="action-buttons">
                            <button type="submit" name="action" value="save" class="btn-save">Save</button>
                            <button type="submit" name="action" value="save_and_add" class="btn-save-add">Save and Add</button>
                        </div>
                    </div>
                </div>
            </form>
        </main>
    </div>

</body>
</html>
