<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Food | LunoFood Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script th:src="@{/js/admin.js}" defer></script>
    <style>
        .form-container {
            max-width: 800px;
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-dark);
        }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #E9EDF7;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            border-color: var(--primary-red);
        }
        .btn-submit {
            background: var(--primary-red);
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-cancel {
            background: #F4F7FE;
            color: var(--text-dark);
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 700;
            margin-left: 10px;
        }
    </style>
</head>
<body>

<aside th:replace="~{fragments/admin-layout :: sidebar('food', 'add')}"></aside>

<main class="main-dashboard">
    <header th:replace="~{fragments/admin-layout :: topbar}"></header>

    <div class="breadcrumb">
        <a href="/admin">Home</a> / <a href="/admin/foods">Menu</a> / <span th:text="${foodDTO.foodId == null ? 'Add New' : 'Edit Item'}">Add Food</span>
    </div>

    <div class="form-container">
        <form th:action="@{/admin/foods/save}" th:object="${foodDTO}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{foodId}">
            <input type="hidden" th:field="*{image}">

            <div class="form-group">
                <label>Food Name</label>
                <input type="text" th:field="*{foodName}" class="form-control" placeholder="Enter food name">
                <span th:if="${#fields.hasErrors('foodName')}" th:errors="*{foodName}" style="color:red; font-size: 12px;"></span>
            </div>

            <div class="form-group">
                <label>Price ($)</label>
                <input type="number" step="0.01" th:field="*{price}" class="form-control" placeholder="0.00">
                <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" style="color:red; font-size: 12px;"></span>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea th:field="*{description}" class="form-control" rows="4" placeholder="Enter food description"></textarea>
                <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color:red; font-size: 12px;"></span>
            </div>

            <div class="form-group">
                <label>Food Image</label>
                <input type="file" name="imageFile" class="form-control" accept="image/*">
                <div th:if="*{image != null}" style="margin-top: 15px;">
                    <img th:src="*{image}" alt="Preview" style="width: 200px; border-radius: 12px; box-shadow: var(--card-shadow);">
                    <p style="font-size: 12px; color: var(--text-muted); margin-top: 5px;">Current display image</p>
                </div>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select th:field="*{categoryId}" class="form-control">
                    <option value="">-- Select Category --</option>
                    <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}"></option>
                </select>
                <span th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" style="color:red; font-size: 12px;"></span>
            </div>

            <div class="form-group">
                <label>Status</label>
                <select th:field="*{status}" class="form-control">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                </select>
                <span th:if="${#fields.hasErrors('status')}" th:errors="*{status}" style="color:red; font-size: 12px;"></span>
            </div>

            <div style="margin-top: 30px;">
                <button type="submit" class="btn-submit">Save Food Item</button>
                <a href="/admin/foods" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</main>
