<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Food Form</title>
</head>
<body>
    <h1 th:text="${foodDTO.foodId == null ? 'Add Food' : 'Edit Food'}">Food Form</h1>
    <nav>
        <a href="/admin">Home</a> |
        <a href="/admin/orders">Orders</a> |
        <a href="/admin/foods">Food Management</a>
    </nav>
    <hr>
    <form th:action="@{/admin/foods/save}" th:object="${foodDTO}" method="post">
        <input type="hidden" th:field="*{foodId}">
        
        <p>
            Name: <input type="text" th:field="*{foodName}">
            <span th:if="${#fields.hasErrors('foodName')}" th:errors="*{foodName}" style="color:red"></span>
        </p>
        
        <p>
            Price: <input type="number" step="0.01" th:field="*{price}">
            <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" style="color:red"></span>
        </p>
        
        <p>
            Description: <textarea th:field="*{description}"></textarea>
            <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color:red"></span>
        </p>
        
        <p>
            Image URL: <input type="text" th:field="*{image}">
            <span th:if="${#fields.hasErrors('image')}" th:errors="*{image}" style="color:red"></span>
        </p>
        
        <p>
            Category: 
            <select th:field="*{categoryId}">
                <option value="">-- Select Category --</option>
                <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}"></option>
            </select>
            <span th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" style="color:red"></span>
        </p>
        
        <p>
            Status: 
            <select th:field="*{status}">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
            </select>
            <span th:if="${#fields.hasErrors('status')}" th:errors="*{status}" style="color:red"></span>
        </p>
        
        <button type="submit">Save</button>
        <a href="/admin/foods">Cancel</a>
    </form>
</body>
</html>
