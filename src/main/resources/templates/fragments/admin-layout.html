<!-- thanh trên cùng, sidebar, bảng điều khiển, quản lý món ăn-->

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="admin-head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - LunoFood</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin-style.css?v=1.2">
    <link rel="stylesheet" href="/css/admin-orders.css">
    <link rel="stylesheet" href="/css/admin-layout.css">
</head>

<body>
    <!-- MẢNH BỐ CỤC CHÍNH -->
    <div th:fragment="layout (content, activeMenu, activeSub)" class="admin-container">
        <!-- Sidebar -->
        <aside th:replace="~{fragments/admin-layout :: sidebar(${activeMenu}, ${activeSub})}"></aside>

        <div class="main-dashboard">
            <!-- Thanh trên cùng -->
            <header th:replace="~{fragments/admin-layout :: topbar}"></header>

            <!-- Khu vực nội dung chính -->
            <div class="content-body">
                <div th:replace="${content}"></div>
            </div>
        </div>
        
        <!-- Tập lệnh chuyển đổi thanh bên & Style -->
        <script th:src="@{/js/admin-layout.js}"></script>
    </div>

    <!-- MẢNH THANH BÊN -->
    <aside th:fragment="sidebar(activeMenu, activeSub)" class="sidebar">
        <div class="sidebar-logo">
            <span class="logo-luno">Luno</span><span class="logo-food">Food</span>
        </div>
        <ul class="sidebar-menu">
            <li>
                <a href="/admin" class="menu-item" th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}">
                    <i class="fa-solid fa-house"></i> Bảng điều khiển
                </a>
            </li>
            <li class="has-submenu" th:classappend="${activeMenu == 'food' ? 'open' : ''}">
                <a href="javascript:void(0)" class="menu-item">
                    <i class="fa-solid fa-utensils"></i> 
                    <span>Quản lý món ăn</span>
                    <i class="fa-solid fa-chevron-down arrow-icon"></i>
                </a>
                <ul class="submenu" th:classappend="${activeMenu == 'food' ? 'show' : ''}">
                    <li><a href="/admin/foods" class="submenu-item" th:style="${activeSub == 'list' ? 'color: #ff0018;' : ''}">Danh sách món ăn</a></li>
                    <li><a href="/admin/foods/grid" class="submenu-item" th:style="${activeSub == 'grid' ? 'color: #ff0018;' : ''}">Lưới món ăn</a></li>
                    <li><a href="/admin/categories" class="submenu-item" th:style="${activeSub == 'categories' ? 'color: #ff0018;' : ''}">Danh mục món ăn</a></li>
                </ul>
            </li>
            <li class="has-submenu" th:classappend="${activeMenu == 'restaurant' ? 'open' : ''}">
                <a href="javascript:void(0)" class="menu-item">
                    <i class="fa-solid fa-store"></i> 
                    <span>Quản lý nhà hàng</span>
                    <i class="fa-solid fa-chevron-down arrow-icon"></i>
                </a>
                <ul class="submenu" th:classappend="${activeMenu == 'restaurant' ? 'show' : ''}">
                    <li><a href="/admin/restaurants" class="submenu-item" th:style="${activeSub == 'list' ? 'color: #ff0018;' : ''}">Danh sách nhà hàng</a></li>
                    <li><a href="/admin/restaurants/add" class="submenu-item" th:style="${activeSub == 'add' ? 'color: #ff0018;' : ''}">Thêm nhà hàng</a></li>
                </ul>
            </li>
            <li class="has-submenu" th:classappend="${activeMenu == 'marketing' ? 'open' : ''}">
                <a href="javascript:void(0)" class="menu-item">
                    <i class="fa-solid fa-bullhorn"></i> 
                    <span>Marketing & Hiển thị</span>
                    <i class="fa-solid fa-chevron-down arrow-icon"></i>
                </a>
                <ul class="submenu" th:classappend="${activeMenu == 'marketing' ? 'show' : ''}">
                    <li><a href="/admin/collections" class="submenu-item" th:style="${activeSub == 'list' ? 'color: #ff0018;' : ''}">Bộ sưu tập</a></li>
                    <!--<li><a href="/admin/banners" class="submenu-item" th:style="${activeSub == 'banners' ? 'color: #ff0018;' : ''}">Banners</a></li>-->
                    <li><a href="/admin/coupons" class="submenu-item" th:style="${activeSub == 'coupons' ? 'color: #ff0018;' : ''}">Mã giảm giá</a></li>
                </ul>
            </li>
            <li><a href="/admin/orders" class="menu-item" th:classappend="${activeMenu == 'orders' ? 'active' : ''}"><i class="fa-solid fa-cart-shopping"></i> Đơn hàng</a></li>
<!--
            <li><a href="/admin/users" class="menu-item" th:classappend="${activeMenu == 'users' ? 'active' : ''}"><i class="fa-solid fa-users"></i> Khách hàng</a></li>
-->
<!--
            <li><a href="/admin/stats" class="menu-item" th:classappend="${activeMenu == 'stats' ? 'active' : ''}"><i class="fa-solid fa-chart-line"></i> Thống kê</a></li>
-->
<!--
            <li><a href="/admin/settings" class="menu-item" th:classappend="${activeMenu == 'settings' ? 'active' : ''}"><i class="fa-solid fa-gear"></i> Cài đặt</a></li>
-->
        </ul>
    </aside>

    <!-- MẢNH TOPBAR -->
    <header th:fragment="topbar" class="top-header">
        <div class="header-left">
            <button id="sidebarToggle" class="sidebar-toggle">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        <div class="user-nav">
            <div class="search-bar">
                <input type="text" placeholder="Tìm kiếm...">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <div class="nav-icons-group">
                <div class="nav-icon-wrapper"><i class="fa-regular fa-envelope nav-icon"></i><span class="nav-dot"></span></div>
                <div class="nav-icon-wrapper"><i class="fa-regular fa-bell nav-icon"></i><span class="nav-dot"></span></div>
            </div>
            <div class="user-profile-wrapper" id="profileDropdownTrigger">
                <img src="https://ui-avatars.com/api/?name=Admin&background=random" class="user-avatar" alt="Admin">
                <div class="profile-dropdown" id="profileDropdown">
                    <div class="dropdown-header">Chào mừng, <span th:text="${#authentication != null ? #authentication.name : 'Admin'}">Admin</span></div>
                    <ul class="dropdown-menu-list">
                        <li><a href="/admin/profile"><i class="fa-regular fa-user"></i> Hồ sơ</a></li>
                        <li><a href="/logout"><i class="fa-solid fa-power-off"></i> Đăng xuất</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

</body>
</html>
