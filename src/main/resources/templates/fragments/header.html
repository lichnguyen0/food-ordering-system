<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
</head>
<body>

<header th:fragment="header(isHome)" class="main-header" th:classappend="${isHome} ? 'is-home-top' : ''" id="mainHeader">
    <div class="container">
        <div class="header-left">
            <a href="/" class="logo">
                <span class="logo-luno">Luno</span><span class="logo-food">Food</span>
            </a>
            
            <form action="/foods" method="get" class="search-container" id="headerSearch">
                <i class="fa-solid fa-location-dot"></i>
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Giao đến: Mỹ Đình Từ Liêm Hà Nội...">
            </form>
        </div>

        <div class="header-right">
            <!-- Cart Icon -->
            <a href="/cart" class="header-cart-btn" id="headerCartBtn" onclick="event.preventDefault(); toggleCartSidebar();">
                <div class="header-cart-icon">
                    <i class="fa-solid fa-basket-shopping"></i>
                    <span class="header-cart-badge" id="headerCartBadge" style="display: none;">0</span>
                </div>
                <span class="header-cart-price" id="headerCartPrice" style="display: none;">0 ₫</span>
            </a>

            <!-- State: Not Logged In -->
            <div sec:authorize="!isAuthenticated()">
                <a href="/login" class="login-register-btn">Đăng nhập/Đăng ký</a>
            </div>

            <!-- State: Logged In -->
            <div sec:authorize="isAuthenticated()" style="display: flex; align-items: center; gap: 15px;">
                <div class="user-profile" id="profileTrigger" onclick="toggleSidebar()">
                    <span th:text="${#authentication.name.substring(0, 1).toUpperCase()}">U</span>
                </div>
            </div>

            <!-- Profile Sidebar (Off-canvas) -->
            <div id="profileSidebar" class="profile-sidebar">
                <div class="sidebar-header">
                    <button class="close-btn" onclick="toggleSidebar()">&times;</button>
                </div>
                <div class="sidebar-content">
                    <a href="/orders" class="sidebar-link">Đơn hàng hiện có</a>
                    <form th:action="@{/logout}" method="post" id="logoutForm">
                        <a href="javascript:void(0)" onclick="document.getElementById('logoutForm').submit()" class="sidebar-link">Logout</a>
                    </form>
                </div>
            </div>
            <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

            <!-- Cart Sidebar (Off-canvas) -->
            <div id="cartSidebar" class="cart-sidebar">
                <div class="sidebar-header">
                    <button id="backToCartBtn" class="close-btn" onclick="switchSidebarView('cart')" style="display:none;"><i class="fa-solid fa-arrow-left"></i></button>
                    <h3 id="sidebarTitle">Giỏ hàng của bạn</h3>
                    <button class="close-btn" onclick="toggleCartSidebar()">&times;</button>
                </div>
                
                <!-- CART VIEW -->
                <div class="sidebar-content" id="cartViewContainer" style="padding: 0; overflow: hidden; display: flex; flex-direction: column; height: 100%;">
                    <div id="cartSidebarItems" class="cart-sidebar-items" style="flex: 1; overflow-y: auto; padding: 20px;">
                        <div class="empty-cart-message">
                            <i class="fa-solid fa-basket-shopping"></i>
                            <p>Giỏ hàng đang trống</p>
                            <a href="javascript:void(0)" class="continue-shopping-btn" onclick="toggleCartSidebar()">Duyệt nhà hàng</a>
                        </div>
                    </div>
                    <div class="sidebar-footer" id="cartSidebarFooter" style="display: none; padding: 20px; border-top: 1px solid #eee; background: #fff;">
                        <div class="total-row" style="display: flex; justify-content: space-between; font-weight: 700; font-size: 16px; margin-bottom: 15px; color: #111;">
                            <span>Tổng cộng:</span>
                            <span id="cartSidebarTotal">0 ₫</span>
                        </div>
                        <a href="/checkout" class="btn-checkout" style="display: block; text-align: center; text-decoration: none; width: 100%; font-weight: 700; padding: 12px; border-radius: 8px;">Tiến hành thanh toán</a>
                    </div>
                </div>

                <!-- OPTIONS VIEW -->
                <div class="sidebar-content" id="optionsViewContainer" style="display:none; padding: 0;">
                    <!-- Scrollable options list -->
                    <div class="options-scroll-area" id="optionsScrollArea" style="padding: 15px; flex-grow: 1; overflow-y: auto;">
                        <div class="options-food-header" style="display: flex; gap: 15px; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #eee; margin-bottom: 15px;">
                            <img id="optFoodImage" src="" alt="Food" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px; flex-shrink: 0;">
                            <div style="flex: 1; min-width: 0;">
                                <h4 id="optFoodName" style="margin: 0 0 4px 0; font-size: 16px; font-weight: 700; color: #111; line-height: 1.3;">Tên món</h4>
                                <p id="optFoodDesc" style="color: #777; font-size: 12px; margin: 0 0 6px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4;"></p>
                                <div id="optFoodPrice" style="color: var(--grab-green); font-weight: 700; font-size: 15px;">0 ₫</div>
                            </div>
                        </div>
                        <div id="optionsFormGroups"></div>
                    </div>
                    
                    <!-- Fixed footer for adding to cart -->
                    <div class="sidebar-footer" style="padding: 15px; border-top: 1px solid #eee; background: #fff;">
                        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;">
                            <span style="font-weight: 500;">Số lượng</span>
                            <div class="cart-quantity-controls" style="display: flex;">
                                <button class="btn-decrease" onclick="changeOptQty(-1)"><i class="fa-solid fa-minus"></i></button>
                                <span class="qty-text" id="optQtyDisplay" style="margin: 0 15px; display: flex; align-items: center;">1</span>
                                <button class="btn-quick-add" onclick="changeOptQty(1)"><i class="fa-solid fa-plus"></i></button>
                            </div>
                        </div>
                        <button id="btnConfirmAddOptions" class="btn-checkout" style="width: 100%; display: flex; justify-content: space-between;">
                            <span>Thêm vào giỏ</span>
                            <span id="optTotalPriceDisplay">0 ₫</span>
                        </button>
                    </div>
                </div>
            </div>
            <div id="cartSidebarOverlay" class="cart-sidebar-overlay" onclick="toggleCartSidebar()"></div>


            <!-- Language Selector -->
            <div class="lang-selector">
                <span>VI</span>
                <i class="fa-solid fa-chevron-down"></i>
            </div>
        </div>
    </div>
    <script th:src="@{/js/cart-sidebar.js}"></script>
</header>



</body>
</html>
