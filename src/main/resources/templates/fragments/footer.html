<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <footer th:fragment="footer" class="main-footer">
        <div class="footer-container">
            <!-- Khu vực Logo -->
            <a href="/" class="footer-logo-link">
                <div class="footer-logo">
                    <span class="logo-luno">Luno</span>
                    <span class="logo-food">Food</span>
                </div>
            </a>

            <hr class="footer-divider">

            <!-- Lưới liên kết và mạng xã hội -->
            <div class="footer-grid-new">
                <div class="footer-col-new">
                    <h4>Về LunoFood</h4>
                    <ul>
                        <li><a href="#">Về LunoFood</a></li>
                        <li><a href="#">Blog</a></li>
                    </ul>
                </div>
                <div class="footer-col-new">
                    <h4>Mở quán trên LunoFood</h4>
                    <ul>
                        <li><a href="#">Trở thành tài xế Luno</a></li>
                    </ul>
                </div>
                <div class="footer-col-new">
                    <h4>Trung tâm hỗ trợ</h4>
                    <ul>
                        <li><a href="#">Câu hỏi thường gặp</a></li>
                    </ul>
                </div>
                <div class="footer-col-new footer-social-col">
                    <div class="footer-social-wrapper">
                        <a href="#" class="footer-social-icon"><i class="fa-brands fa-facebook-f"></i></a>
                        <a href="#" class="footer-social-icon"><i class="fa-brands fa-instagram"></i></a>
                        <a href="#" class="footer-social-icon"><i class="fa-brands fa-twitter"></i></a>
                    </div>
                </div>
            </div>

            <hr class="footer-divider">

            <!-- Huy hiệu tải app & Bản quyền, liên kết dưới cùng -->
            <div class="footer-bottom-new">
                <div class="footer-badges-new">
                    <a href="#"><img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" alt="App Store"></a>
                    <a href="#"><img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play"></a>
                </div>
                <div class="footer-info-new">
                    <span class="footer-copyright-new">© 2026 LunoFood</span>
                    <div class="footer-links-new">
                        <a href="#">Câu hỏi thường gặp</a>
                        <span class="footer-dot-sep">•</span>
                        <a href="#">Chính sách bảo mật</a>
                    </div>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
