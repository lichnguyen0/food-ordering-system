<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <footer th:fragment="footer" class="main-footer">
        <div class="container" style="display: block; width: 100%; max-width: 1200px; margin: 0 auto; padding: 60px 15px;">
            <div class="footer-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 40px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 40px;">
                <div class="footer-col">
                    <div class="logo">
                        <span class="logo-luno" style="color: #fff; font-weight: 900; font-size: 32px;">Luno</span>
                        <span class="logo-food" style="color: #fff; font-weight: 600; font-size: 32px;">Food</span>
                    </div>
                    <p style="margin-top: 20px; font-size: 14px; opacity: 0.7; line-height: 1.6; color: #fff;">
                        Nền tảng đặt đồ ăn trực tuyến hàng đầu, mang hương vị đến tận cửa nhà bạn chỉ trong vài phút.
                    </p>
                </div>
                <div class="footer-col">
                    <h4 style="color: #fff; margin-bottom: 20px; font-size: 18px;">Về LunoFood</h4>
                    <ul style="list-style: none; padding: 0;">
                        <li style="margin-bottom: 12px;"><a href="#" style="color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px;">Giới thiệu</a></li>
                        <li style="margin-bottom: 12px;"><a href="#" style="color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px;">Trung tâm hỗ trợ</a></li>
                        <li style="margin-bottom: 12px;"><a href="#" style="color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px;">Câu hỏi thường gặp</a></li>
                    </ul>
                </div>
                <div class="footer-col">
                    <h4 style="color: #fff; margin-bottom: 20px; font-size: 18px;">Pháp lý</h4>
                    <ul style="list-style: none; padding: 0;">
                        <li style="margin-bottom: 12px;"><a href="#" style="color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px;">Điều khoản sử dụng</a></li>
                        <li style="margin-bottom: 12px;"><a href="#" style="color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px;">Chính sách bảo mật</a></li>
                    </ul>
                </div>
                <div class="footer-col">
                    <h4 style="color: #fff; margin-bottom: 20px; font-size: 18px;">Tải ứng dụng</h4>
                    <div class="app-badges" style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" alt="App Store" style="height: 40px;">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Play Store" style="height: 40px;">
                    </div>
                </div>
            </div>
            <div class="footer-bottom" style="padding-top: 40px; display: flex; justify-content: space-between; align-items: center; color: rgba(255,255,255,0.5); font-size: 13px;">
                <p>© 2026 LunoFood. Tất cả quyền được bảo lưu.</p>
                <div class="social-links" style="display: flex; gap: 20px; font-size: 20px;">
                    <i class="fa-brands fa-facebook"></i>
                    <i class="fa-brands fa-instagram"></i>
                    <i class="fa-brands fa-tiktok"></i>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
