<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Account | Food Ordering System</title>
    <!-- Google Fonts Inter -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="login-wrapper">
    <!-- Cột bên trái: Ảnh nền Pesto Pasta -->
    <div class="login-left" th:style="'background-image: url(' + @{/images/login-bg.png} + ');'">
    </div>

    <!-- Cột bên phải: Biểu mẫu đăng nhập -->
    <div class="login-right">
        <div class="login-card-wrapper">
            <div class="login-header">
                <h1>Login to Account</h1>
                <p class="login-subtitle">Please enter your email and password to continue</p>
            </div>

            <form th:action="@{/login}" method="post" class="login-form">
                <!-- Thông báo Spring Security -->
                <div th:if="${param.error}" class="alert alert-danger">
                    <i class="fa-solid fa-circle-exclamation"></i> Tên đăng nhập hoặc mật khẩu không chính xác.
                </div>
                <div th:if="${param.logout}" class="alert alert-success">
                    <i class="fa-solid fa-circle-check"></i> Bạn đã đăng xuất thành công.
                </div>
                <div th:if="${param.registerSuccess}" class="alert alert-success">
                    <i class="fa-solid fa-circle-check"></i> Đăng ký thành công! Vui lòng đăng nhập.
                </div>

                <div class="form-group">
                    <label class="form-label" for="username">Email Address</label>
                    <div class="input-container">
                        <input type="text" id="username" name="username" class="form-control" placeholder="Email Address" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-container">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember-me">
                        <span class="custom-checkbox"></span>
                        <span class="label-text">Remember Password</span>
                    </label>
                </div>
                
                <div class="forgot-link-wrapper">
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-login">Sign In</button>
            </form>

            <div class="login-footer">
                Don't have an account? <a th:href="@{/register}" class="create-account-link">Create Account</a>
            </div>
        </div>
    </div>
</div>

<!-- Liên kết tới tệp JavaScript riêng biệt -->
<script th:src="@{/js/login.js}"></script>
</body>
</html>
