<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | LunoFood</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script th:src="@{/js/food-filter.js}"></script>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container" style="margin-top: 30px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0;">Ưu đãi hôm nay</h2>
        
        <div>
            <label style="font-weight: 500; color: var(--text-muted);">Lọc theo danh mục:</label>
            <select id="categorySelect" onchange="filterFoods()" 
                    style="padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color); outline: none;">
                <option value="">Tất cả danh mục</option>
                <option th:each="c : ${categories}" 
                        th:value="${c.categoryId}" 
                        th:text="${c.categoryName}"
                        th:selected="${c.categoryId == categoryId}"></option>
            </select>
        </div>
    </div>

    <div id="foodList">
        <div th:replace="~{fragments/food-table :: foodTable}"></div>
    </div>
</main>

</body>
</html>
