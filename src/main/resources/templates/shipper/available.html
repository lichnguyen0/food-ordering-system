<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shipper-layout :: shipper-head}"><title>Đơn chờ lấy</title></head>
<body>
<div th:replace="~{fragments/shipper-layout :: layout(~{::main-content}, 'available')}">
    <th:block th:fragment="main-content">

        <div th:if="${successMessage}" class="alert alert-success">
            <i class="fa-solid fa-circle-check"></i> <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-error">
            <i class="fa-solid fa-circle-xmark"></i> <span th:text="${errorMessage}"></span>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="card-title">
                    <i class="fa-solid fa-box-open" style="color:#22c55e"></i>
                    Đơn hàng sẵn sàng lấy
                    <span style="background:#f0fdf4;color:#15803d;padding:3px 10px;border-radius:20px;font-size:12px;margin-left:8px"
                          th:text="${#lists.size(availableOrders)} + ' đơn'">0 đơn</span>
                </span>
            </div>
            <div style="padding:20px">
                <div th:if="${#lists.isEmpty(availableOrders)}" class="empty-state">
                    <i class="fa-solid fa-box-open"></i>
                    <p style="font-weight:600">Chưa có đơn nào sẵn sàng để lấy</p>
                    <p style="font-size:13px;margin-top:6px">Bếp chưa hoàn tất đơn hàng nào. Vui lòng chờ!</p>
                </div>

                <div th:each="order : ${availableOrders}" class="order-card available">
                    <div class="info-row">
                        <div>
                            <div class="order-num" th:text="'Đơn #' + ${order.orderId}"></div>
                            <div style="font-size:13px;color:#64748b;margin-top:4px"
                                 th:text="${order.restaurant?.name ?: '—'}">Nhà hàng</div>
                        </div>
                        <span class="badge badge-ready">
                            <i class="fa-solid fa-check"></i> Sẵn sàng lấy
                        </span>
                    </div>

                    <div style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px">
                        <!-- Địa chỉ giao -->
                        <div style="background:#f8fafc;border-radius:10px;padding:12px">
                            <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#94a3b8;font-weight:700;margin-bottom:6px">
                                <i class="fa-solid fa-location-dot" style="color:#06b6d4"></i> Giao đến
                            </div>
                            <div style="font-size:13px;font-weight:600;color:#0f172a"
                                 th:text="${order.user?.fullName ?: order.user?.username}">Khách</div>
                            <div style="font-size:12px;color:#64748b;margin-top:3px"
                                 th:text="${order.user?.phone ?: '—'}">SĐT</div>
                            <div style="font-size:12px;color:#64748b;margin-top:3px"
                                 th:text="${order.deliveryAddress}">Địa chỉ</div>
                        </div>
                        <!-- Thông tin đơn -->
                        <div style="background:#f8fafc;border-radius:10px;padding:12px">
                            <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#94a3b8;font-weight:700;margin-bottom:6px">
                                <i class="fa-solid fa-receipt" style="color:#06b6d4"></i> Chi tiết
                            </div>
                            <div style="font-size:18px;font-weight:800;color:#06b6d4"
                                 th:text="${#numbers.formatDecimal(order.totalAmount,0,'COMMA',0,'POINT') + 'đ'}">0đ</div>
                            <div style="font-size:12px;color:#64748b;margin-top:3px"
                                 th:text="${order.paymentMethod}">CASH</div>
                            <div style="font-size:12px;color:#64748b;margin-top:3px"
                                 th:text="'Bếp xong: ' + ${order.readyAt != null ? #temporals.format(order.readyAt,'HH:mm') : '—'}"></div>
                        </div>
                    </div>

                    <!-- Ghi chú -->
                    <div th:if="${order.deliveryNote}"
                         style="margin-top:12px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 12px;font-size:12px;color:#92400e">
                        <i class="fa-solid fa-note-sticky"></i>
                        <span th:text="${order.deliveryNote}"></span>
                    </div>

                    <!-- Nút nhận đơn -->
                    <div style="margin-top:14px;display:flex;justify-content:flex-end">
                        <form th:action="@{/shipper/order/{id}/pickup(id=${order.orderId})}" method="post">
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-motorcycle"></i> Nhận đơn này
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </th:block>
</div>
</body>
</html>
