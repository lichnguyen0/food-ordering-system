<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${selectedCategory != null ? selectedCategory.categoryName + ' | LunoFood' : 'Khám phá quán ăn | LunoFood'}">Khám phá quán ăn | LunoFood</title>
    <meta name="description" content="Khám phá danh sách các nhà hàng tuyệt vời trên LunoFood. Đặt ngay món ăn yêu thích của bạn!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/restaurant-list.css(v=1.0)}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header -->
    <div th:replace="~{fragments/header :: header(false)}"></div>

    <!-- Header Banner -->
    <div class="restaurant-list-header">
        <div class="container">
            <h1>
                <i class="fa-solid fa-store" style="margin-right: 8px;"></i>
                <span th:text="${selectedCategory != null ? 'Quán ăn: ' + selectedCategory.categoryName : 'Khám phá quán ăn'}">Khám phá quán ăn</span>
            </h1>
            <p th:text="${selectedCategory != null ? 'Danh sách nhà hàng phục vụ thực đơn ' + selectedCategory.categoryName + ' tốt nhất dành cho bạn' : 'Khám phá tất cả các nhà hàng chất lượng cao đang hoạt động trên hệ thống'}">Mô tả</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="restaurant-list-page">
        <div class="container">

            <!-- Category Chips Filter -->
            <div class="category-chips-container">
                <a th:href="@{/restaurant}" class="chip-link">
                    <span class="category-chip" th:classappend="${selectedCategoryId == null ? 'active' : ''}">Tất cả</span>
                </a>
                <a th:each="c : ${categories}" th:href="@{/restaurant(categoryId=${c.categoryId})}" class="chip-link">
                    <span class="category-chip" 
                          th:classappend="${selectedCategoryId == c.categoryId ? 'active' : ''}" 
                          th:text="${c.categoryName}">Danh mục</span>
                </a>
            </div>

            <!-- Restaurant Grid -->
            <div class="restaurant-grid">

                <!-- Empty State -->
                <div th:if="${restaurants.empty}" class="empty-res">
                    <i class="fa-solid fa-store-slash"></i>
                    <h3>Chưa có nhà hàng nào</h3>
                    <p>Hiện tại chưa có quán ăn nào phục vụ danh mục này. Bạn vui lòng chọn danh mục khác nhé!</p>
                </div>

                <!-- Cards -->
                <a th:each="r : ${restaurants}" th:href="@{/restaurant/{id}(id=${r.restaurantId})}" class="res-card-link">
                    <div class="res-card">
                        <div class="res-img-wrapper">
                            <img th:if="${r.image != null}" th:src="${r.image}" th:alt="${r.name}">
                            <i th:if="${r.image == null}" class="fa-solid fa-store no-img-icon"></i>
                            <span th:if="${r.hasPromo}" class="res-promo-badge" th:text="${r.promoDiscount != null ? 'Giảm ' + r.promoDiscount.intValue() + '%' : 'Promo'}">Promo</span>
                        </div>
                        <div class="res-info">
                            <div class="res-name" th:text="${r.name}">Tên nhà hàng</div>
                            <div class="res-tags" th:text="${r.categoriesString}">Danh mục</div>

                            <div class="res-meta">
                                <span>
                                    <i class="fa-solid fa-star"></i>
                                    <strong style="color: #1c1c1c;" th:text="${r.rating}">4.5</strong>
                                </span>
                                <span>
                                    <i class="fa-regular fa-clock"></i>
                                    <span th:text="${r.deliveryTime + ' phút'}">25 phút</span>
                                </span>
                                <span>
                                    <i class="fa-solid fa-road"></i>
                                    <span th:text="${r.distance + ' km'}">2.5 km</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </a>

            </div>

        </div>
    </div>

</body>
</html>
